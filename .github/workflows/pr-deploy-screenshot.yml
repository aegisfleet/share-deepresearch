name: PR Deploy Screenshot

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-and-screenshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install dependencies
        run: |
          gem install bundler
          bundle install

      - name: Build site (Jekyll)
        run: |
          bundle exec jekyll build --config _config_dev.yml

      - name: Start local server
        run: |
          nohup bundle exec jekyll serve --config _config_dev.yml --host 0.0.0.0 --port 4000 &
          sleep 10

      - name: Take screenshot with Playwright
        uses: microsoft/playwright-github-action@v1
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Capture screenshot
        run: |
          npx playwright install chromium
          npx playwright screenshot http://localhost:4000 screenshot.png

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-screenshot
          path: screenshot.png

      - name: Post screenshot to PR
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ![PR Preview Screenshot](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/pr-screenshot/screenshot.png)
            
            この画像は自動生成されたプレビューです。
