name: PR Deploy Screenshot

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-screenshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Setup bundle cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-

      - name: Setup Playwright browsers cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby-dev libvips libnss3 libgtk-3-0 libgbm-dev \
            fonts-noto-cjk fonts-noto-cjk-extra fontconfig libfontconfig1 libfreetype6 \
            libxss1 libxshmfence-dev libatk-bridge2.0-0
          # Ubuntu 24.04以降のlibasound2はlibasound2t64にリネームされているため、存在すればそちらをインストール
          if apt-cache show libasound2t64 > /dev/null 2>&1; then sudo apt-get install -y libasound2t64; fi
          # フォントキャッシュの更新
          fc-cache -fv
          pnpm -v

      - name: Set up Ruby
        uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1.319.0
        with:
          ruby-version: '3.2'

      - name: Install dependencies
        run: |
          gem install bundler
          bundle config path vendor/bundle
          bundle install --jobs 4 --retry 3
          pnpm install --frozen-lockfile

      - name: Build site (Jekyll)
        run: |
          bundle exec jekyll build --config _config_dev.yml

      - name: Start local server and wait for it to be ready
        run: |
          nohup bundle exec jekyll serve --config _config_dev.yml --host 0.0.0.0 --port 4000 &
          # サーバーが準備できるまで待機（最大30秒）
          for i in {1..30}; do
            if curl -s http://localhost:4000 > /dev/null; then
              echo "Server is ready!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Server failed to start within 30 seconds"
              exit 1
            fi
            echo "Waiting for server to be ready... ($i/30)"
            sleep 1
          done

      - name: Install Playwright Chromium only
        run: |
          # キャッシュがない場合のみインストール
          if [ ! -d ~/.cache/ms-playwright ]; then
            pnpm exec playwright install chromium
          fi

      - name: Capture screenshots
        run: |
          node scripts/screenshot.js

      - name: Deploy screenshots to assets branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 一時クローン先にassetsブランチを取得、存在しない場合は新規作成
          if ! git clone --depth=1 --branch screenshot-assets https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git screenshots-repo; then
            mkdir screenshots-repo
            cd screenshots-repo
            git init
            git checkout -b screenshot-assets
            git remote add origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
            touch .gitkeep
            git add .gitkeep
            git commit -m "Initial commit"
            git push -u origin screenshot-assets
            cd ..
          fi
          
          cd screenshots-repo
          PR_DIR="pr-${{ github.event.pull_request.number }}"
          mkdir -p "$PR_DIR"
          
          cp ../screenshot-light.png "$PR_DIR/"
          cp ../screenshot-dark.png "$PR_DIR/"
          cp ../screenshot-article-light.png "$PR_DIR/"
          cp ../screenshot-article-dark.png "$PR_DIR/"
          
          git add .
          git commit -m "Upload screenshots for PR #${{ github.event.pull_request.number }} (Run #${{ github.run_id }})" || echo "No changes"
          git push origin screenshot-assets

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-screenshots
          path: |
            screenshot-light.png
            screenshot-dark.png
            screenshot-article-light.png
            screenshot-article-dark.png

      - name: Post screenshot to PR
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ### 📸 PR Preview Screenshots

            | Top Page (Light) | Top Page (Dark) |
            | --- | --- |
            | ![Top Light](https://raw.githubusercontent.com/${{ github.repository }}/screenshot-assets/pr-${{ github.event.pull_request.number }}/screenshot-light.png) | ![Top Dark](https://raw.githubusercontent.com/${{ github.repository }}/screenshot-assets/pr-${{ github.event.pull_request.number }}/screenshot-dark.png) |

            | Article Page (Light) | Article Page (Dark) |
            | --- | --- |
            | ![Article Light](https://raw.githubusercontent.com/${{ github.repository }}/screenshot-assets/pr-${{ github.event.pull_request.number }}/screenshot-article-light.png) | ![Article Dark](https://raw.githubusercontent.com/${{ github.repository }}/screenshot-assets/pr-${{ github.event.pull_request.number }}/screenshot-article-dark.png) |

            ---
            [PR Preview Screenshots（Artifacts ダウンロード）](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
