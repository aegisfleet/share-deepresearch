name: Update GA4 Metrics

on:
  schedule:
    - cron: '0 15 * * *'  # 日本時間 0:00 (UTC 15:00) に実行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-metrics:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-analytics-data
          pip install python-frontmatter
          pip install packaging

      - name: Create credentials file
        run: |
          echo '${{ secrets.GA4_CREDENTIALS_JSON }}' > ga4-credentials.json

      - name: Update GA4 metrics
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_CREDENTIALS_JSON: ga4-credentials.json
        run: |
          python scripts/update_ga4_metrics.py
          rm ga4-credentials.json

      - name: Commit changes
        run: |
          # Configure git user
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Determine the branch name to push to
          BRANCH_TO_PUSH="${{ github.ref_name }}" # e.g., main

          echo "Attempting to commit and push to branch: $BRANCH_TO_PUSH"

          git add .
          if ! git diff --staged --quiet; then
            echo "Committing changes..."
            git commit -m "Update GA4 metrics"
            git push origin "HEAD:$BRANCH_TO_PUSH"
          else
            echo "No changes to commit."
          fi
