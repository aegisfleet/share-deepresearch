name: PR Screenshot

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  capture_screenshot:
    runs-on: ubuntu-latest
    permissions: # Required for peter-evans/create-or-update-comment
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node.js dependencies (Puppeteer, http-server)
        run: npm install puppeteer http-server

      - name: Setup Ruby and Jekyll
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Start HTTP server
        run: npx http-server _site --port 8080 &

      - name: Wait for server to start
        run: sleep 5

      - name: Capture screenshot with Puppeteer
        id: capture # Give this step an id to access its output
        run: |
          node -e "
          const puppeteer = require('puppeteer');
          (async () => {
            const browser = await puppeteer.launch({ headless: 'new', args: ['--no-sandbox', '--disable-setuid-sandbox'] });
            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 800 });
            try {
              await page.goto('http://localhost:8080', { waitUntil: 'networkidle0' });
              await page.screenshot({ path: 'screenshot.png', fullPage: true });
              console.log('Screenshot captured: screenshot.png');
              // Output the path for the next step if needed, though it's a fixed name
              console.log('::set-output name=screenshot_path::screenshot.png');
            } catch (err) {
              console.error('Error capturing screenshot:', err);
              process.exit(1);
            } finally {
              await browser.close();
            }
          })();
          "

      - name: Upload screenshot to temporary hosting (transfer.sh)
        id: upload_screenshot # Give this step an id to access its output
        run: |
          IMAGE_URL=$(curl -sfL --upload-file screenshot.png https://transfer.sh/screenshot.png)
          if [ -z "$IMAGE_URL" ]; then
            echo "Failed to upload screenshot or get URL."
            # Fallback: Link to artifacts if upload fails
            SHA=$(echo $GITHUB_SHA | cut -c1-7)
            ARTIFACT_URL="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "::set-output name=image_url::Screenshot failed to upload. View artifact at $ARTIFACT_URL (commit: $SHA)"
            echo "::set-output name=upload_failed::true"
          else
            echo "Screenshot uploaded to: $IMAGE_URL"
            echo "::set-output name=image_url::$IMAGE_URL"
            echo "::set-output name=upload_failed::false"
          fi

      - name: Comment on PR with Screenshot
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            Preview of the changes:

            ${{ steps.upload_screenshot.outputs.upload_failed == 'true' && steps.upload_screenshot.outputs.image_url || format('![Screenshot]({0})', steps.upload_screenshot.outputs.image_url) }}

            ---
            *Screenshot captured by GitHub Actions. Direct link: ${{ steps.upload_screenshot.outputs.image_url }}*
            *If the image doesn't load, it might be due to the temporary hosting. You can also check the workflow run artifacts.*
          edit-mode: replace # Replace previous comment if any by this action
