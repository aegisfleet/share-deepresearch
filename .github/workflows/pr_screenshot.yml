name: PR Screenshot

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  capture_screenshot:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node.js dependencies (Puppeteer, http-server)
        run: npm install puppeteer http-server

      - name: Setup Ruby and Jekyll
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Start HTTP server
        run: npx http-server _site --port 8080 &

      - name: Wait for server to start
        run: sleep 5

      - name: Capture screenshot with Puppeteer
        run: |
          node -e "
          const puppeteer = require('puppeteer');
          (async () => {
            const browser = await puppeteer.launch({ headless: 'new', args: ['--no-sandbox', '--disable-setuid-sandbox'] });
            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 800 }); // Standard viewport
            try {
              await page.goto('http://localhost:8080', { waitUntil: 'networkidle0' });
              await page.screenshot({ path: 'screenshot.png', fullPage: true });
              console.log('Screenshot captured: screenshot.png');
            } catch (err) {
              console.error('Error capturing screenshot:', err);
              process.exit(1);
            } finally {
              await browser.close();
            }
          })();
          "

      - name: Upload screenshot to Imgur
        id: upload_to_imgur
        uses: marocchino/image-actions@v2 # Use the specific version
        with:
          path: 'screenshot.png'
          upload_name: 'pr_screenshot.png' # Optional name for the file on Imgur
          # Anonymous upload to Imgur by default, no token needed for that.
          # For higher rate limits or account-based uploads, IMGUR_CLIENT_ID would be needed.

      - name: Upload screenshot artifact (as fallback)
        if: always() # Run this step even if Imgur upload fails
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-artifact # Differentiate from potential Imgur link name
          path: screenshot.png
          retention-days: 7

      - name: Comment on PR with Embedded Screenshot
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            Preview of the changes:

            ${{ steps.upload_to_imgur.outputs.image_url_markdown || 'Image upload to Imgur failed or no markdown returned.' }}

            ---
            *Screenshot captured by GitHub Actions. If the image above is not displayed, you can download it from the [workflow run artifacts for this commit](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) (look for "screenshot-artifact").*
          edit-mode: replace
